[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 要求 >= 22.23.4
  NODE_VERSION = "22.23.4"

# 静态资源带 hash，可长期缓存
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SITE_URL 用于 canonical / sitemap 绝对地址。
# 在 Netlify 后台 Environment variables 里设，绑定域名后改成正式域名。
